name: ucs-detect compliance

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.framework }} ucs-detect compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0, net11.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned detector
        run: python -m pip install -r tests/requirements-ucs-detect.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview
      - name: Run tests and exhaustive Unicode compliance
        run: dotnet test --project tests/SvcSystems.UI.Terminal.Tests/SvcSystems.UI.Terminal.Tests.csproj --framework ${{ matrix.framework }}
      - name: Upload detector reports and PTY transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucs-detect-${{ matrix.framework }}
          path: tests/SvcSystems.UI.Terminal.Tests/bin/Debug/${{ matrix.framework }}/TestResults/ucs-detect/*
          if-no-files-found: warn
          retention-days: 30
